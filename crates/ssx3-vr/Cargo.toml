[package]
name = "ssx3-vr"
description = "OpenXR diagnostics and future SteamVR front end for SSX 3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ash = "0.38.0"
openxr = { version = "0.22.0", default-features = false, features = ["loaded"] }
wgpu = "30.0.1"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[[bin]]
name = "ssx3-vr-probe"
path = "src/main.rs"
